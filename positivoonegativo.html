<!DOCTYPE html>
<html lang="en">

<body>
    <script>
let numero = Number(prompt("Ingresa un número:"));

if (numero > 0) {
    document.write("El número es positivo");
} else if (numero < 0) {
    document.write("El número es negativo");
} else {
    document.write("El número es 0");
}
    </script>
