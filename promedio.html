<!DOCTYPE html>
<html lang="en">

<body>
    <script>
        let nombre = prompt("Ingresa el nombre del alumno:");
let asignatura = prompt("Ingresa la asignatura:");
let promedio = parseFloat(prompt("Ingresa el promedio del alumno:"));

document.write("Nombre: " + nombre + "<br>");
document.write("Asignatura: " + asignatura + "<br>");
document.write("Promedio: " + promedio + "<br>");

if (promedio >= 6) {
    document.write("Aprobó");
} else {
    document.write("Reprobó");
}
    </script>
